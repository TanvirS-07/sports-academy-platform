[project]
name = "sports-academy-backend"
version = "0.1.0"
description = "FastAPI backend for the Sports Academy Management Platform"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.0",
    "uvicorn[standard]==0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear, UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the alembic package as first-party.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
