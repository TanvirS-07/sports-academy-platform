name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the older, still-running workflow.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy_ci_password
          POSTGRES_DB: academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy -d academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://academy:academy_ci_password@localhost:5432/academy_test
      TEST_DATABASE_URL: postgresql+psycopg://academy:academy_ci_password@localhost:5432/academy_test
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # This action publishes exact release tags only (no floating v10 tag).
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies (from uv.lock)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (from package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end smoke test (Docker Compose + Playwright)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      # Install host dependencies BEFORE starting Docker Compose. Otherwise the
      # container's node_modules volume creates a root-owned frontend/node_modules
      # folder on the host and npm ci fails with EACCES.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Apply migrations
        run: docker compose exec -T backend alembic upgrade head

      - name: Create the coach account used by the tests
        env:
          COACH_PASSWORD: e2e-coach-password
        run: >
          docker compose exec -T -e COACH_PASSWORD backend
          python -m scripts.create_coach
          --email e2e-coach@example.com --first-name E2E --last-name Coach

      - name: Run Playwright
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
